name: Check levels, rebuild & deploy site

# Runs on every push to main:
#  1. validates all levels and runs the tests
#  2. rebuilds the site and commits the built files if the code changed
#  3. publishes the site to GitHub Pages
# Works with Pages source set to "GitHub Actions" (recommended) and also
# with "Deploy from a branch" (main, / root), since the built site is
# committed to the repository root.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate levels and run tests
        run: npm test
      - name: Build site into the repository root
        run: npm run build
      - name: Commit rebuilt site (only if it changed)
        run: |
          git add -A index.html assets editor/index.html secret-creations/index.html .nojekyll
          if git diff --cached --quiet; then
            echo "Site files already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild site [skip ci]"
            git push
          fi
      - name: Collect the files to publish
        run: |
          mkdir _site
          cp -r index.html assets editor secret-creations levels .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
