name: Check levels & rebuild site

# GitHub Pages serves this branch directly ("Deploy from a branch", main, / root).
# This workflow only checks things: it validates all levels and runs the
# tests, and if game/editor code changed it rebuilds the site files at the
# repository root and commits them. Pages then publishes the branch as-is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate levels and run tests
        run: npm test
      - name: Build site into the repository root
        run: npm run build
      - name: Commit rebuilt site (only if it changed)
        run: |
          git add -A index.html assets editor/index.html secret-creations/index.html .nojekyll
          if git diff --cached --quiet; then
            echo "Site files already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild site [skip ci]"
            git push
          fi
